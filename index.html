<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- Babylon.js and game dependencies -->
    <script src="babylon.max.js"></script>
    <script src="babylon.gui.js"></script>
    <script src="babylon.glTF2FileLoader.js"></script>
    <script src="babylon.objFileLoader.js"></script>
    <script src="babylonjs.proceduralTextures.js"></script>
    <script src="cannon.js"></script>
    <script src="hammer.min.js"></script>
    
    <!-- Asset path remapping for GitHub Pages root-level deployment -->
    <script>
        // Intercept all fetch and XMLHttpRequest calls to remap asset paths
        // from /assets/{type}/* to root-level files
        
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            let url = args[0];
            if (typeof url === 'string') {
                // Remap all asset folder references to root
                url = url.replace(/\/assets\/musics\//g, '/');
                url = url.replace(/\/assets\/sounds\//g, '/');
                url = url.replace(/\/assets\/models\/weapons\/rifle\//g, '/');
                url = url.replace(/\/assets\/models\/skull\//g, '/');
                url = url.replace(/\/assets\/images\//g, '/');
                url = url.replace(/\/assets\/skybox\//g, '/skybox_');
            }
            args[0] = url;
            return originalFetch.apply(this, args);
        };

        // Also intercept XMLHttpRequest for asset loading
        const originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url, ...rest) {
            if (typeof url === 'string') {
                url = url.replace(/\/assets\/musics\//g, '/');
                url = url.replace(/\/assets\/sounds\//g, '/');
                url = url.replace(/\/assets\/models\/weapons\/rifle\//g, '/');
                url = url.replace(/\/assets\/models\/skull\//g, '/');
                url = url.replace(/\/assets\/images\//g, '/');
                url = url.replace(/\/assets\/skybox\//g, '/skybox_');
            }
            return originalOpen.call(this, method, url, ...rest);
        };

        // Intercept BABYLON.CubeTexture to handle skybox path separately
        const originalCubeTexture = BABYLON.CubeTexture;
        BABYLON.CubeTexture = function(rootUrl, scene, extensions, noMipmap, files, onLoad, onError, format, prefiltered, forcedExtension) {
            if (typeof rootUrl === 'string' && rootUrl.includes('assets/skybox')) {
                rootUrl = rootUrl.replace('assets/skybox/skybox', 'skybox_');
            }
            return originalCubeTexture.call(this, rootUrl, scene, extensions, noMipmap, files, onLoad, onError, format, prefiltered, forcedExtension);
        };
    </script>
    
    <!-- Bundled app (contains all game code compiled) -->
    <script src="app.js"></script>
</body>
</html>
