<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- Babylon.js and game dependencies -->
    <script src="babylon.max.js"></script>
    <script src="babylon.gui.js"></script>
    <script src="babylon.glTF2FileLoader.js"></script>
    <script src="babylon.objFileLoader.js"></script>
    <script src="babylonjs.proceduralTextures.js"></script>
    <script src="cannon.js"></script>
    <script src="hammer.min.js"></script>
    
    <!-- Asset path remapping for GitHub Pages deployment -->
    <script>
        // Intercept asset loading to remap paths from /assets/* to root
        const originalFetch = window.fetch;
        window.fetch = function(...args) {
            let url = args[0];
            if (typeof url === 'string') {
                // Remap asset paths from /assets/musics/*, /assets/sounds/*, etc. to root
                url = url.replace(/^\/assets\/(musics|sounds|models|skybox)\//, '/');
            }
            args[0] = url;
            return originalFetch.apply(this, args);
        };
    </script>
    
    <!-- Bundled app (contains all game code compiled) -->
    <script src="app.js"></script>
</body>
</html>
